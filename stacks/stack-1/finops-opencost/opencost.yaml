apiVersion: v1
kind: Namespace
metadata:
  name: finops-system
---
apiVersion: source.toolkit.fluxcd.io/v1beta2
kind: HelmRepository
metadata:
  name: opencost-repo
  namespace: finops-system
spec:
  interval: 1h
  url: https://opencost.github.io/opencost-helm-chart
---
apiVersion: helm.toolkit.fluxcd.io/v2beta2
kind: HelmRelease
metadata:
  name: opencost
  namespace: finops-system
spec:
  interval: 5m
  chart:
    spec:
      chart: opencost
      version: ">=1.0.0"
      sourceRef:
        kind: HelmRepository
        name: opencost-repo
  values:
    opencost:
      exporter:
        defaultClusterId: "k3s-cncf-lab"
      prometheus:
        external:
          # VictoriaMetrics ile muazzam entegrasyon noktamız!
          url: "http://vmetrics-victoria-metrics-single-server.observability.svc.cluster.local:8428"
    ui:
      enabled: true
    resources:
      requests:
        cpu: 10m
        memory: 10Mi
      limits:
        memory: 256Mi

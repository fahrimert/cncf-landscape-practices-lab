apiVersion: v1
kind: Namespace
metadata:
  name: finops-system
---
apiVersion: source.toolkit.fluxcd.io/v1beta2
kind: HelmRepository
metadata:
  name: opencost-repo
  namespace: finops-system
spec:
  interval: 1h
  url: https://opencost.github.io/opencost-helm-chart
---
apiVersion: helm.toolkit.fluxcd.io/v2beta2
kind: HelmRelease
metadata:
  name: opencost
  namespace: finops-system
spec:
  interval: 5m
  chart:
    spec:
      chart: opencost
      version: ">=1.0.0"
      sourceRef:
        kind: HelmRepository
        name: opencost-repo
values:
    opencost:
      exporter:
        defaultClusterId: "k3s-cncf-lab"
      prometheus:
        internal:
          enabled: true    # KENDI İÇİNDEKİ HAFİF PROMETHEUS'U AÇTIK
        external:
          enabled: false   # VICTORIAMETRICS'I İPTAL ETTİK
    ui:
      enabled: true
